[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparks-standalone"
version = "0.1.0rc8"
description = "Scattering and Photoionization: Amplitudes, Response Kernels and Spectra"
requires-python = ">=3.11"
dependencies = ["matrix-sparks[vibronic,pyscf,gaussian-fchk]==0.1.0rc8", "matrix-gaussian==0.1.0rc8", "matrix-orca==0.1.0rc8", "matrix-dvr==0.1.0rc8", "matrix-vpt2-vci==0.1.0rc8", "matrix-zaff==0.1.0rc8"]

[project.scripts]
sparks = "sparks.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
