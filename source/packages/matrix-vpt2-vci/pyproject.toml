[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-vpt2-vci"
version = "0.1.0rc8"
description = "TRINITY VPT2/VCI workflows for MATRIX"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc8",
  "matrix-numerics==0.1.0rc8",
  "numpy>=1.24",
]

[project.optional-dependencies]
gfn2-zaff = [
  "matrix-gfn2==0.1.0rc8",
  "matrix-link[gfn2-zaff-composite]==0.1.0rc8",
  "matrix-rovib==0.1.0rc8",
]
full = [
  "matrix-chem==0.1.0rc8",
  "matrix-engines==0.1.0rc8",
  "matrix-gaussian==0.1.0rc8",
  "matrix-gf==0.1.0rc8",
  "matrix-qm==0.1.0rc8",
  "matrix-zaff==0.1.0rc8",
]
zaff = [
  "matrix-chem==0.1.0rc8",
  "matrix-gf==0.1.0rc8",
  "matrix-zaff==0.1.0rc8",
]

[tool.setuptools.packages.find]
where = ["src"]
